<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8" />
<title>TikBVW Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    font-family: 'Manrope', system-ui, sans-serif;
    overflow: hidden;
  }
  #stack {
    position: fixed;
    left: 24px;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 420px;
  }
  .alert {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(10, 13, 19, 0.88);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    color: #eef1f6;
    animation: enter .35s cubic-bezier(.2,.9,.25,1), leave .4s ease forwards;
    animation-delay: 0s, var(--hold, 6s);
    backdrop-filter: blur(6px);
  }
  .alert .icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px; flex-shrink: 0;
  }
  .alert.gift .icon   { background: linear-gradient(135deg,#ffb648,#c97a12); }
  .alert.follow .icon { background: linear-gradient(135deg,#8b7bff,#4f3fc9); }
  .alert.share .icon  { background: linear-gradient(135deg,#8b7bff,#4f3fc9); }
  .alert.chat .icon   { background: linear-gradient(135deg,#37d6c4,#127f73); }

  .alert .text b { display: block; font-size: 14px; }
  .alert .text span { font-size: 12.5px; color: #9aa5b8; }

  @keyframes enter {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes leave {
    from { opacity: 1; }
    to   { opacity: 0; transform: translateY(-8px); }
  }

  #speaking {
    position: fixed;
    right: 24px;
    bottom: 24px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(10,13,19,0.85);
    border: 1px solid rgba(55,214,196,0.3);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #37d6c4;
    letter-spacing: .05em;
  }
  #speaking.active { display: flex; }
  .vu { display:flex; align-items:flex-end; gap:3px; height:14px; }
  .vu span { width:3px; background:#37d6c4; border-radius:2px; height:30%; animation: vubar .9s ease-in-out infinite; }
  .vu span:nth-child(2){animation-delay:.1s;} .vu span:nth-child(3){animation-delay:.2s;}
  @keyframes vubar { 0%,100%{height:25%;} 50%{height:100%;} }
</style>
</head>
<body>

<div id="stack"></div>
<div id="speaking"><div class="vu"><span></span><span></span><span></span></div> ГОВОРИ...</div>

<audio id="ttsPlayer"></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/overlay.js"></script>
</body>
</html>
