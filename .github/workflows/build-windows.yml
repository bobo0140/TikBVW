name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Bundle ESM app into a single CommonJS file
        run: |
          npx esbuild server.js --bundle --platform=node --target=node18 \
            --format=cjs --outfile=dist-build/bundle.cjs \
            --external:bufferutil --external:utf-8-validate

      - name: Copy static assets next to the bundle
        run: |
          mkdir -p dist-build/public
          cp -r public/* dist-build/public/

      - name: Add pkg configuration
        run: cp packaging/pkg-package.json dist-build/package.json

      - name: Compile Windows executable
        working-directory: dist-build
        run: npx --yes @yao-pkg/pkg . --targets node22-win-x64 --output ../dist/TikBVW.exe

      - name: Download Windows Piper binaries
        run: |
          curl -sL -o /tmp/piper_win.zip \
            "https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip"
          mkdir -p dist/TikBVW-Windows
          unzip -q /tmp/piper_win.zip -d dist/TikBVW-Windows

      - name: Assemble distribution folder
        run: |
          mkdir -p dist/TikBVW-Windows/voices
          mv dist/TikBVW.exe dist/TikBVW-Windows/TikBVW.exe
          cp packaging/README_WINDOWS.txt "dist/TikBVW-Windows/ПРОЧЕТИ_МЕ.txt"
          cp packaging/voices_README.txt "dist/TikBVW-Windows/voices/ПРОЧЕТИ_МЕ.txt"

      - name: Zip the distribution
        working-directory: dist
        run: zip -rq TikBVW-Windows.zip TikBVW-Windows

      - name: Publish GitHub Release with the zip attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TikBVW-Windows.zip
          name: TikBVW ${{ github.ref_name }}
          body: |
            Готов Windows пакет за TikBVW.

            **Как се ползва:**
            1. Свали `TikBVW-Windows.zip` по-долу и го разархивирай.
            2. Сложи `bg_BG-dimitar-medium.onnx` и `bg_BG-dimitar-medium.onnx.json`
               в папка `voices/`.
            3. Щракни двукратно върху `TikBVW.exe`.

            Нищо друго не се инсталира — Node.js и Piper вече са включени.
          generate_release_notes: false
